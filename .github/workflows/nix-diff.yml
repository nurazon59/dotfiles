name: Nix diff

on:
  pull_request:
    branches:
      - main
    paths:
      - config/nix/nix-darwin/flake.lock

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: skills-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: nurazon59
          repositories: skills
          permission-contents: read

      - uses: natsukium/nix-diff-action@b5c316c6cafc8470037d7f330b178aaeeba96ba4
        with:
          directory: config/nix/nix-darwin
          comment-strategy: update
          attributes: |
            - displayName: work
              attribute: darwinConfigurations.work.system
            - displayName: personal
              attribute: darwinConfigurations.personal.system
        env:
          NIX_CONFIG: |
            access-tokens = github.com=${{ steps.skills-token.outputs.token }}
