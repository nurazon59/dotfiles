name: Nix diff

on:
  pull_request:
    branches:
      - main
    paths:
      - config/nix/nix-darwin/flake.lock

permissions:
  contents: read
  pull-requests: write

jobs:
  vulnerability-scan:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Free disk space for Nix builds
        run: |
          df -h /
          sudo rm -rf "$HOME/Library/Android/sdk"
          df -h /

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b

      - name: Restore Nix store
        id: nix-cache
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        continue-on-error: true
        with:
          # Unique per run/attempt, so failed builds can publish a new checkpoint.
          primary-key: macos15-nix-${{ hashFiles('config/nix/nix-darwin/flake.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-prefixes-first-match: |
            macos15-nix-${{ hashFiles('config/nix/nix-darwin/flake.lock') }}-
            macos15-nix-

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: skills-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: nurazon59
          repositories: skills
          permission-contents: read

      # Keep time for uploading a cache even when the build times out.
      - name: Build system closures and vulnix
        timeout-minutes: 300
        working-directory: config/nix/nix-darwin
        env:
          NIX_CONFIG: |
            access-tokens = github.com=${{ steps.skills-token.outputs.token }}
        run: |
          nix build .#darwinConfigurations.work.system --out-link "$RUNNER_TEMP/work-system"
          nix build .#darwinConfigurations.personal.system --out-link "$RUNNER_TEMP/personal-system"
          nix build .#packages.aarch64-darwin.vulnix --out-link "$RUNNER_TEMP/vulnix"

      # A step timeout fails the build, but leaves time to save completed store paths.
      - name: Save Nix store
        if: ${{ always() && steps.nix-cache.outputs.hit-primary-key != 'true' }}
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        continue-on-error: true
        with:
          primary-key: ${{ steps.nix-cache.outputs.primary-key }}
          gc-max-store-size-macos: 8G

      - name: Scan system closures for known vulnerabilities
        working-directory: config/nix/nix-darwin
        env:
          LANG: C.UTF-8
        run: |
          "$RUNNER_TEMP/vulnix/bin/vulnix" "$RUNNER_TEMP/work-system" "$RUNNER_TEMP/personal-system"

  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: skills-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: nurazon59
          repositories: skills
          permission-contents: read

      - uses: natsukium/nix-diff-action@4ab5eda848658193fbbd804efb5d4d7c2f166f37
        with:
          directory: config/nix/nix-darwin
          comment-strategy: update
          attributes: |
            - displayName: work
              attribute: darwinConfigurations.work.system
            - displayName: personal
              attribute: darwinConfigurations.personal.system
        env:
          NIX_CONFIG: |
            access-tokens = github.com=${{ steps.skills-token.outputs.token }}
